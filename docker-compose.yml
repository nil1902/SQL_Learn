services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chaicode_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chaicode_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
